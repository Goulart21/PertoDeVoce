        <section>

            <h1>Meu Perfil</h1>

            <p>
                Visualize e altere seus dados pessoais.
            </p>

        </section>

        <section>

            <h2>Dados pessoais</h2>

            <form>

                <div>

                    <label for="nome">
                        Nome
                    </label>

                    <input type="text" id="nome" name="nome" value="">

                </div>

                <div>

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" name="email" value="">

                </div>

                <div>

                    <label for="senha">
                        Nova senha
                    </label>

                    <input type="password" id="senha" name="senha">

                </div>

                <button type="submit">
                    Salvar alterações
                </button>

            </form>

        </section>

        <section>

            <h2>Conta</h2>

            <button type="button">
                Sair da conta
            </button>

        </section>
